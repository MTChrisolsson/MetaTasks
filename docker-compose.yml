name: metatasks-dev  # <--- CRITICAL: Put it here at the very top

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: metatask
      POSTGRES_USER: metatask
      POSTGRES_PASSWORD: super-secure-password
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data # <--- RENAME THIS
    # ports: 
    #   - "5433:5432" # OPTIONAL: Only expose if you need to connect via DBeaver/pgAdmin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metatask"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ports:
    #   - "6380:6379" # OPTIONAL: Avoids conflict with Prod Redis if exposed
    volumes:
      - dev_redis_data:/data # <--- RENAME THIS
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DEBUG=True
      - USE_SQLITE=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DATABASE_URL=postgresql://metatask:super-secure-password@db:5432/metatask
      - REDIS_URL=redis://redis:6379/0
      - DB_NAME=metatask
      - DB_USER=metatask
      - DB_PASSWORD=super-secure-password
    volumes:
      - .:/app
      - ./logs:/app/logs
      - dev_static_volume:/app/staticfiles # <--- RENAME THIS
      - dev_media_volume:/app/media   # <--- RENAME THIS
    ports:
      - "8080:8000" # <--- CHANGE THIS: Access Dev at http://vps-ip:8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "docker/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      
  celery:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DEBUG=True
      - USE_SQLITE=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DATABASE_URL=postgresql://metatask:super-secure-password@db:5432/metatask
      - REDIS_URL=redis://redis:6379/0
      - DB_NAME=metatask
      - DB_USER=metatask
      - DB_PASSWORD=super-secure-password
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A mediap worker -l info

  celery-beat:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DEBUG=True
      - USE_SQLITE=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DATABASE_URL=postgresql://metatask:super-secure-password@db:5432/metatask
      - REDIS_URL=redis://redis:6379/0
      - DB_NAME=metatask
      - DB_USER=metatask
      - DB_PASSWORD=super-secure-password
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A mediap beat -l info

volumes:
  dev_postgres_data: # <--- RENAME ALL THESE
  dev_redis_data:
  dev_static_volume:
  dev_media_volume: