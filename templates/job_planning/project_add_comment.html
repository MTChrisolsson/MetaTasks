{% extends 'job_planning/base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-4">Add Comment</h1>
        <p class="text-gray-600 mb-6">Add a comment to the project <strong>{{ project.name }}</strong>.</p>
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label for="{{ form.content.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">Comment</label>
                {{ form.content }}
            </div>
            <div class="flex justify-end gap-4">
                <a href="{% url 'job_planning:project-detail' project.id %}"
                   class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-md">Cancel</a>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-md">Add Comment</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
